name: Publish to npm
# workflow-scope verified: push of this file works via gh keyring token

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: Publish @omdp/dsh-connector
        working-directory: dsh-connector
        # If this exact version is already on npm (e.g. a previous run published
        # it), skip instead of failing — so one package's republish does not
        # block the other package's first publish.
        # NB: the run value is single-quoted so the colon in "skip: ..." is not
        # parsed as a YAML nested mapping (which made GitHub reject the file).
        run: 'npm publish --provenance --access public || echo "skip: version already published"'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @omdp/dsh-vision-bridge
        working-directory: dsh-vision-bridge
        run: 'npm publish --provenance --access public || echo "skip: version already published"'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @omdp/dsh-gitbash-win
        working-directory: dsh-gitbash-win
        run: 'npm publish --provenance --access public || echo "skip: version already published"'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @omdp/dsh-key-fallback
        working-directory: dsh-key-fallback
        run: 'npm publish --provenance --access public || echo "skip: version already published"'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
