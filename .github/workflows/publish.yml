name: Publish to npm
# workflow-scope verified: push of this file works via gh keyring token

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Publish every package in the repo. A version that is already on the
      # registry is skipped (so republishing one package does not block the
      # others), but any OTHER failure fails the job loudly.
      #
      # Why not `npm publish ... || echo "skip"`: that mask made a real
      # failure look like a success. On 2026-09-24 three tags were pushed at
      # once, three runs raced to publish the same versions, npm rejected the
      # duplicates with E409/E403, and every one of those runs still reported
      # conclusion=success while one package silently never shipped. Ask the
      # registry first and only swallow "already published".
      - name: Publish packages
        run: |
          set -euo pipefail
          for dir in dsh-connector dsh-vision-bridge dsh-key-fallback dsh-archived-sessions; do
            name=$(node -p "require('./$dir/package.json').name")
            ver=$(node -p "require('./$dir/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "skip: $name@$ver is already published"
              continue
            fi
            echo "::group::publish $name@$ver"
            (cd "$dir" && npm publish --provenance --access public)
            echo "::endgroup::"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
